name: Release Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'holophonix_utils/__init__.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Extract version from __init__.py
      id: version
      run: |
        VERSION=$(grep -oP '(?<="version" : \()[^)]+' holophonix_utils/__init__.py | tr -d " ")
        VERSION=${VERSION//,/.}
        echo "Extracted version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Validate version format
      id: version_validation
      run: |
        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Invalid version format: $VERSION"
          exit 1
        fi
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: Get Previous Version
      id: previous_version
      run: |
        set -e
        
        # Fetch all tags from remote
        git fetch --tags
        
        # Get all version tags (including beta)
        echo "Getting all version tags"
        ALL_TAGS=$(git tag -l "v*" --sort=-version:refname)
        
        echo "All version tags found:"
        echo "$ALL_TAGS"
        
        # Filter out current version tags (including beta)
        PREVIOUS_TAG=$(echo "$ALL_TAGS" | grep -v "v$VERSION" | head -n 1)
        
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous version tag found, using initial commit"
          PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
        else
          echo "Previous version tag found: $PREVIOUS_TAG"
          # Get the full commit hash for the previous tag
          PREVIOUS_TAG=$(git rev-list -n 1 $PREVIOUS_TAG || echo "Failed to get commit hash for tag $PREVIOUS_TAG")
        fi
        
        echo "Using commit hash: $PREVIOUS_TAG as previous version"
        echo "previous_version=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: Check version and tags
      id: version_check
      run: |
        # Get all tags for this version
        EXISTING_TAGS=$(git tag -l "v$VERSION*")
        
        # Check if any release exists (beta or stable)
        if gh release view "v$VERSION-beta" >/dev/null 2>&1 || \
           gh release view "v$VERSION-stable" >/dev/null 2>&1 || \
           [ -n "$EXISTING_TAGS" ]; then
          echo "Release or tag already exists for version $VERSION"
          echo "release=false" >> $GITHUB_OUTPUT
        else
          echo "No existing release or tag found for version $VERSION"
          echo "release=true" >> $GITHUB_OUTPUT
        fi
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: Determine release type
      id: release_type
      run: |
        FEATURE_NUM=$(echo "$VERSION" | cut -d. -f2)
        if [ $((FEATURE_NUM % 2)) -eq 1 ]; then
          echo "type=beta" >> $GITHUB_OUTPUT
        else
          echo "type=stable" >> $GITHUB_OUTPUT
        fi
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: Generate Changelog
      id: changelog
      run: |
        VERSION=$(grep -oP '(?<="version" : \()[^)]+' holophonix_utils/__init__.py | tr -d " " | tr , .)
        ALL_TAGS=$(git tag -l "v*" --sort=-version:refname)
        PREVIOUS_TAG=$(echo "$ALL_TAGS" | grep -v "v$VERSION" | head -n 1)
        
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found, using initial commit"
          PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
        fi
        
        echo "# Changelog" > CHANGELOG.md
        echo "## Changes since $PREVIOUS_TAG" >> CHANGELOG.md
        COMMITS=$(git log --oneline --no-merges $PREVIOUS_TAG..HEAD)
        
        if [ -z "$COMMITS" ]; then
          echo "- No significant changes" >> CHANGELOG.md
        else
          echo "$COMMITS" | while IFS= read -r commit; do
            COMMIT_HASH=$(echo "$commit" | cut -d' ' -f1)
            COMMIT_MESSAGE=$(echo "$commit" | cut -d' ' -f2-)
            COMMIT_TYPE=$(echo "$COMMIT_MESSAGE" | grep -oP '^\w+')
            if [ -n "$COMMIT_TYPE" ]; then
              COMMIT_MESSAGE=$(echo "$COMMIT_MESSAGE" | sed "s/^$COMMIT_TYPE/**$COMMIT_TYPE**/")
            fi
            echo "- $COMMIT_MESSAGE (\`$COMMIT_HASH\`)" >> CHANGELOG.md
          done
        fi

    - name: Validate Changelog
      id: validate_changelog
      run: |
        if echo "$CHANGELOG" | grep -q 'Merge pull request'; then
          echo "Changelog contains merge commits - please squash commits before release"
          exit 1
        fi
      env:
        CHANGELOG: ${{ steps.changelog.outputs.changelog }}

    - name: Create Git Tag
      if: steps.version_check.outputs.release == 'true'
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git tag v${{ steps.version.outputs.version }}-${{ steps.release_type.outputs.type }}
        git push origin v${{ steps.version.outputs.version }}-${{ steps.release_type.outputs.type }}

    - name: Zip the addon folder
      if: steps.version_check.outputs.release == 'true'
      run: |
        zip -r holophonix_utils_v${{ steps.version.outputs.version }}_${{ steps.release_type.outputs.type }}.zip holophonix_utils

    - name: Create Release
      if: steps.version_check.outputs.release == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ steps.release_type.outputs.type }}
        release_name: Release v${{ steps.version.outputs.version }} ${{ steps.release_type.outputs.type }}
        draft: false
        prerelease: ${{ steps.release_type.outputs.type == 'beta' }}
        body_path: CHANGELOG.md

    - name: Upload Release Asset
      if: steps.version_check.outputs.release == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: holophonix_utils_v${{ steps.version.outputs.version }}_${{ steps.release_type.outputs.type }}.zip
        asset_name: holophonix_utils_v${{ steps.version.outputs.version }}_${{ steps.release_type.outputs.type }}.zip
        asset_content_type: application/zip